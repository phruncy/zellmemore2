<div class="automaton-controller-container">
    <app-rule-control [rule]="automaton.rule" (ruleChanged)="changeRule($event)"></app-rule-control>
    <mat-divider class="desktop-divider" [vertical]="true"></mat-divider>
    <mat-divider class="mobile-divider"></mat-divider>
    <app-controls-slider
        [settings]="cellnumberSettings"
        [(value)]="automaton.cellnumber"></app-controls-slider>
    <mat-divider class="desktop-divider" [vertical]="true"></mat-divider>
    <mat-divider class="mobile-divider"></mat-divider>
    <app-edge-control [(checked)]="automaton.isCircular"></app-edge-control>
    <mat-divider class="desktop-divider" [vertical]="true"></mat-divider>
    <mat-divider class="mobile-divider"></mat-divider>
    <app-state-control
        [options]="automatonStartOptions"
        [(initState)]="automaton.initMode"></app-state-control>
    <mat-divider class="desktop-divider" [vertical]="true"></mat-divider>
    <mat-divider class="mobile-divider"></mat-divider>
    <app-controls-slider [settings]="speedSettings" [(value)]="automaton.fps"></app-controls-slider>
</div>
