<div class="controls">
    @for (step of unlockedSteps; track $index) {
        <div
            class="step-marker"
            [class.active]="currentStep() === $index + 1"
            (click)="goToStep($index + 1)"
            matRipple
            [matRippleCentered]="true"
            [matRippleUnbounded]="true"
            [@slideInDescription]></div>
    }
</div>
