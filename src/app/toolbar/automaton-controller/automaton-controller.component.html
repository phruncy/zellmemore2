<div class="automaton-controller-container">
    <app-rule-control [rule]="rule" (ruleChanged)="changeRule($event)"></app-rule-control>
    <mat-divider class="desktop-divider" [vertical]="true"></mat-divider>
    <mat-divider class="mobile-divider"></mat-divider>
    <app-controls-slider
        [settings]="cellnumberSettings"
        [(value)]="automaton.cellnumber"></app-controls-slider>
    <mat-divider class="desktop-divider" [vertical]="true"></mat-divider>
    <mat-divider class="mobile-divider"></mat-divider>
    <app-edge-control
        [checked]="isCircular()"
        (checkedChange)="changeEdgeMode($event)"></app-edge-control>
    <mat-divider class="desktop-divider" [vertical]="true"></mat-divider>
    <mat-divider class="mobile-divider"></mat-divider>
    <app-state-control
        [options]="automatonStartOptions"
        [initState]="initMode()"
        (initStateChange)="changeInitMode($event)"></app-state-control>
    <mat-divider class="desktop-divider" [vertical]="true"></mat-divider>
    <mat-divider class="mobile-divider"></mat-divider>
    <app-controls-slider
        [settings]="speedSettings"
        [value]="fps()"
        (valueChange)="changeFps($event)"></app-controls-slider>
</div>
