<div class="widget-container" #fullscreen>
    <app-p5-visualization [sketchIndex]="{ sketchId }"></app-p5-visualization>
    <div class="widget-overlay-header">
        <fa-icon [icon]="faTimes" (click)="requestDestruction()" class="btn fade-in"></fa-icon>
        <div class="header-label fade-in">{{ title }}</div>
        <fa-icon [icon]="faExpand" (click)="enterFullscreen()" class="btn fade-in"></fa-icon>
    </div>
</div>
